body: "The system requirements line names iPad devices. Spec §1-3 only establishes Android 10+ and iOS 17+ and does not confirm iPad support. 故障シナリオ: If the app is iPhone-only, the legal notice describes a supported device that does not exist.（出典: /code-review）"
