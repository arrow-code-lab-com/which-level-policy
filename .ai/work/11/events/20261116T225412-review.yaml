body: "APP_STORE_ID is concatenated without any check of its format. 故障シナリオ: A maintainer pastes 'id1234567890' (the form shown in App Store URLs) or a number with spaces. The result is https://apps.apple.com/app/idid1234567890, a broken URL that iOS users are then redirected to automatically.（出典: /code-review・今回の差分の範囲外）"
