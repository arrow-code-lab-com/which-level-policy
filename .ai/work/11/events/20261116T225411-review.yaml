body: "Once APP_STORE_ID is set, iOS gets the same unconditional redirect, which also replaces the page in history. 故障シナリオ: After the App Store release, an iPhone user is sent to the App Store right away. They can't see the page or its policy links, and going back skips the page entirely.（出典: /code-review・今回の差分の範囲外）"
