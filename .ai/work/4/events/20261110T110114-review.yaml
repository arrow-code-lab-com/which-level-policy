fix: "日英とも OS を分けて書く。例: 「本アプリをアンインストールすると削除されます。Android では、端末の「設定」→「アプリ」→ 本アプリ →「ストレージ」から本アプリのキャッシュを消去しても削除できます。」iOS はアンインストールのみ（必要なら「iOS が空き容量を確保するために削除することがあります」を足す）。第 7 章の「地図のキャッシュについては第 5 章をご覧ください」はそのままでよい。"
state: open
summary: 地図のキャッシュの消し方「端末の設定から本アプリのキャッシュを消去」は iOS では行えない（日英とも）
body: 第 5 章に追加した「本アプリをアンインストールするか、端末の設定から本アプリのキャッシュを消去すると削除されます」（英語版 index.html:286 "or when the App's cache is cleared from the device settings"）は、Android（設定 → アプリ → ストレージ → キャッシュを消去）には当てはまるが、iOS の設定には 1 本のアプリのキャッシュだけを消す操作が無い（iPhone ストレージの画面にあるのは「App を取り除く」（書類とデータは残る）と「App を削除」だけ）。本ポリシーは第 1 章で「Android と iOS で取り扱いが異なる点は、各章で個別に記載します」と約束しており、削除の手段という利用者の権利に関わる記述が iOS の利用者にとって事実と異なる。iOS の利用者がこの記述に従ってキャッシュを消そうとしても手段が見つからず、ストア審査（App Store ガイドライン 5.1.1 のデータの保持・削除の説明）とも食い違い得る。根拠資料 docs/privacy/google-maps.md §4 も「アプリの削除や OS 側のキャッシュ消去で消える」と OS を分けずに書いており、その曖昧さをそのまま両 OS の事実として書いている。
