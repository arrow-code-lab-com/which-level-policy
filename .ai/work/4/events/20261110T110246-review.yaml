fix: 文言は根拠資料 docs/privacy/google-maps.md §4 どおりなので、このままでよいかは which-level#28 の実装（全データ消去の処理）を見て判断する。実装がキャッシュを消さないなら「本アプリからは削除できない」を「本アプリの「すべてのデータを削除」の対象外です」に弱めるのが安全。
